name: test

# Runs the engine unit tests on every push and PR. No build step, no
# dependencies — just Node's built-in test runner over engine/*.test.js.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
