<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quarterly Investment Review — Template</title>
<style>
:root {
  --bg:#f0f2f5; --surface:#fff; --surface2:#f5f6f8;
  --border:#e0e3ea; --blue:#2563eb; --green:#16a97a;
  --red:#dc2626; --yellow:#d97706; --purple:#7c3aed;
  --text:#1a1d2e; --muted:#6b7280;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#fff 0%,#f0f2f5 100%);border-bottom:1px solid var(--border);padding:22px 36px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.header h1 span{color:var(--blue)}
.header p{color:var(--muted);font-size:.82rem;margin-top:3px}
.hbadge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;text-align:right}
.hbadge .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.hbadge .val{font-size:1.15rem;font-weight:700;color:var(--green);margin-top:2px}

/* MAIN */
.main{padding:24px 36px;max-width:1380px;margin:0 auto}
.sec{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:var(--blue)}
.kpi .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.kpi .val{font-size:1.7rem;font-weight:700;margin-top:5px;line-height:1}
.kpi .sub{font-size:.75rem;color:var(--muted);margin-top:5px}
.kpi .icon{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.kbl .icon{background:rgba(37,99,235,.09)} .kbl .val{color:var(--blue)}
.kgr .icon{background:rgba(22,169,122,.09)} .kgr .val{color:var(--green)}
.kye .icon{background:rgba(217,119,6,.09)}  .kye .val{color:var(--yellow)}
.kpu .icon{background:rgba(124,58,237,.09)} .kpu .val{color:var(--purple)}

/* CHART CARDS */
.charts-row{display:grid;grid-template-columns:320px 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}

/* ALLOC LEGEND */
.alloc-leg{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:.75rem}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg-bar-bg{flex:1;height:5px;background:#ebebeb;border-radius:3px;overflow:hidden}
.leg-bar-fill{height:100%;border-radius:3px}
.leg-pct{width:46px;text-align:right;font-weight:700;font-size:.75rem}

/* INV GRID */
.inv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;transition:border-color .2s,box-shadow .2s}
.inv-card:hover{border-color:var(--blue);box-shadow:0 4px 20px rgba(37,99,235,.08)}
.inv-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.inv-name{font-size:.97rem;font-weight:700}
.inv-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.badge{font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.b-priv{background:rgba(245,197,66,.18);color:#b45309}
.b-fi  {background:rgba(37,99,235,.12); color:var(--blue)}
.b-pub {background:rgba(22,169,122,.12);color:var(--green)}
.b-alt {background:rgba(124,58,237,.12);color:var(--purple)}
.b-char{background:rgba(16,185,129,.12);color:#059669}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.m{background:var(--surface2);border-radius:8px;padding:9px 11px}
.m .ml{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.m .mv{font-size:.9rem;font-weight:700;margin-top:3px}
.gain{color:var(--green)} .loss{color:var(--red)} .neut{color:var(--text)}
.pbar-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.pbar-lbl{font-size:.68rem;color:var(--muted);width:80px;flex-shrink:0}
.pbar-bg{flex:1;height:5px;background:#ebebeb;border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px}
.pbar-val{font-size:.7rem;font-weight:700;width:60px;text-align:right;flex-shrink:0}
.fnote{font-size:.68rem;color:var(--muted);font-style:italic;margin-top:7px;line-height:1.5}
.flag-chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:10px}
.f-above{background:rgba(22,169,122,.12);color:var(--green);border:1px solid rgba(22,169,122,.25)}
.f-inline{background:rgba(217,119,6,.1);color:var(--yellow);border:1px solid rgba(217,119,6,.25)}
.f-below{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.25)}

/* Header right-stack: holds the asset-class badge and (in builder) the include/exclude toggle */
.inv-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}

/* Click-to-edit fields (builder only — non-builder mode renders these as plain text) */
.inv-edit{border-bottom:1px dashed transparent;cursor:text;transition:border-color .15s,background .15s;padding:0 2px;border-radius:2px}
.inv-edit:hover{border-bottom-color:rgba(37,99,235,.5);background:rgba(37,99,235,.04)}
.inv-edit:focus{outline:2px solid var(--blue);outline-offset:2px;background:rgba(37,99,235,.06);border-radius:3px}
.inv-edit:empty:before{content:attr(data-placeholder);color:#cbd5e1;font-style:italic}

/* Table row style for excluded investments (visible but muted; not in TOTAL) */
.tbl tr.excl-row td{opacity:.55;font-style:italic}
.tbl tr.excl-row:hover td{opacity:.75}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th{text-align:left;padding:9px 12px;font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(224,227,234,.5);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .tot td{font-weight:700;border-top:1px solid var(--border);border-bottom:none;background:#f8f9fc}
.tbl tr:hover td{background:rgba(37,99,235,.025)}
.tdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

/* CALLOUT */
.callout{border-radius:12px;padding:16px 20px;margin-top:16px;display:flex;align-items:flex-start;gap:12px;background:linear-gradient(135deg,rgba(124,58,237,.05),rgba(37,99,235,.03));border:1px solid rgba(124,58,237,.18)}
.callout-icon{font-size:1.5rem;flex-shrink:0;margin-top:1px}
.callout-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;color:var(--purple)}
.callout-body{font-size:.78rem;color:var(--muted);line-height:1.65}

/* PERF ROW */
.perf-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* LIFE INSURANCE */
.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.life-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.life-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.life-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.life-m{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.life-m .ll{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.life-m .lv{font-size:.95rem;font-weight:700;margin-top:3px}
.prog-wrap{margin-top:2px}
.prog-lbl{font-size:.66rem;color:var(--muted);margin-bottom:4px}
.prog-track{background:var(--surface);border:1px solid var(--border);border-radius:4px;height:7px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:4px}
.life-combined{background:linear-gradient(135deg,rgba(22,169,122,.05),rgba(37,99,235,.04));border:1px solid rgba(22,169,122,.2);border-radius:8px;padding:12px 16px;display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.lc-item .lci-l{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lc-item .lci-v{font-size:1.05rem;font-weight:700;margin-top:3px}

/* Q1 reference line under each investment card */
.q1-ref{font-size:.72rem;color:var(--muted);border-top:1px dashed var(--border);margin-top:10px;padding-top:8px;line-height:1.5}
.q1-ref-label{font-weight:700;color:var(--text)}
.q1-ref-sep{color:var(--border);margin:0 4px}

/* US ENERGY TRACKING TABLE */
.usen-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;overflow-x:auto}
.usen-sub{font-size:.78rem;color:var(--muted);margin-bottom:14px}
.usen-table{width:100%;border-collapse:collapse;font-size:.74rem;min-width:900px}
.usen-table thead th{padding:9px 8px;text-align:right;font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2);font-weight:700}
.usen-table thead th:first-child{text-align:left;background:var(--surface2)}
.usen-table tbody td{padding:8px 10px;text-align:right;border-bottom:1px solid rgba(224,227,234,.5);white-space:nowrap}
.usen-table tbody td.usen-label{text-align:left;font-weight:600;color:var(--text);min-width:220px}
.usen-table tbody td.usen-blank{color:#cbd5e1}
.usen-table tbody td.usen-emph{color:var(--green);font-weight:600}
.usen-table tbody tr.usen-bold td{background:#f8f9fc;font-weight:700;border-top:1px solid var(--border)}
.usen-table .usen-note{display:block;font-size:.62rem;font-style:italic;color:var(--muted);margin-top:2px;font-weight:400}
.usen-table tbody tr:hover td{background:rgba(37,99,235,.025)}
.usen-table tbody tr.usen-bold:hover td{background:#f1f3f9}

/* FOOTER */
.footer{margin-top:36px;padding:18px 36px;border-top:1px solid var(--border);font-size:.7rem;color:var(--muted);text-align:center}

/* SVG defaults */
.svg-chart{width:100%;display:block}

/* PRINT */
@media print {
  @page { margin: 0.6in 0.5in; size: letter portrait; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff !important; }
  .header { border-bottom: 1px solid #ccc; padding: 14px 0; }
  .main   { padding: 12px 0; max-width: 100%; }
  .footer { padding: 12px 0; margin-top: 20px; }
  .kpi-grid { grid-template-columns: repeat(4,1fr); gap: 8px; }
  .charts-row { grid-template-columns: 1fr; gap: 12px; }
  .inv-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .perf-row { grid-template-columns: 1fr; gap: 12px; }
  .life-grid  { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi, .card, .inv-card, .life-card { overflow: visible !important; }
  .kpi, .card, .inv-card, .life-card, .callout {
    page-break-inside: avoid; break-inside: avoid;
  }
  .sec { page-break-after: avoid; break-after: avoid; margin-top: 18px; }
  .kpi:hover { border-color: var(--border) !important; }
  svg { overflow: visible; }
  .fnote, .flag-chip { page-break-inside: avoid; break-inside: avoid; }
}
</style>
</head>

/* ─── Helpers ──────────────────────────────────────────────────────── */
const fmt = {
  money: (n, decimals=0) => {
    if (n === null || n === undefined) return "—";
    const sign = n < 0 ? "–" : "";
    const abs = Math.abs(n);
    return sign + "$" + abs.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  },
  moneyShort: (n) => {
    if (n === null || n === undefined) return "—";
    const sign = n < 0 ? "–" : "";
    const abs = Math.abs(n);
    if (abs >= 1e6) return sign + "$" + (abs/1e6).toFixed(2) + "M";
    if (abs >= 1e3) return sign + "$" + (abs/1e3).toFixed(0) + "K";
    return sign + "$" + abs.toFixed(0);
  },
  pct: (n, decimals=1) => {
    if (n === null || n === undefined) return "—";
    const sign = n >= 0 ? "+" : "–";
    return sign + Math.abs(n).toFixed(decimals) + "%";
  },
  signed: (n) => (n >= 0 ? "+" : "–") + fmt.money(Math.abs(n))
};

/* Escape HTML so user-edited names/subtitles can't break layout or inject markup. */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[<>&"']/g, c =>
    ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Mask any run of 6+ digits in a string to only the last 4 (e.g. "Acct 123456789" → "Acct ****6789").
   Used when account numbers appear in account names/descriptions in the deliverable. */
function maskAccountNumbers(str) {
  return String(str || '').replace(/\d{6,}/g, m => '****' + m.slice(-4));
}

/* In builder mode show raw text (so it's editable); in deliverable mode mask account numbers. */
function rawOrMasked(str) {
  return window.__QIR_BUILDER__ ? (str || '') : maskAccountNumbers(str || '');
}

/* Render the Include/Exclude toggle pill. Returns empty string in deliverable mode. */
function inclusionTogglePill(inv, idx) {
  if (!window.__QIR_BUILDER__) return '';
  const isExcl = !!inv.excludeFromTotals;
  const cls    = isExcl ? 'is-excl' : 'is-incl';
  const label  = isExcl ? '✗ Excluded' : '✓ Included';
  return '<span class="toggle-incl ' + cls + '" onclick="toggleExcludeByIndex(' + idx + ')"' +
         ' title="Click to toggle whether this account is included in the portfolio totals">' +
         label + '</span>';
}

  "Public Equities": { badge: "b-pub",  color: "#4f8ef7", strokeColor: "#2563eb" },
  "Public":          { badge: "b-pub",  color: "#f05c6e", strokeColor: "#dc2626" },
  "Alternatives":    { badge: "b-alt",  color: "#9b6ef7", strokeColor: "#7c3aed" },
  "Charity":         { badge: "b-char", color: "#10b981", strokeColor: "#059669" }
};
const classMeta = (cls) => CLASS_META[cls] || { badge: "b-fi", color: "#94a3b8", strokeColor: "#64748b" };

/* Template-variable interpolation: replaces {{client}}, {{quarter}}, {{asOfDate}}
   in strings with the corresponding fields from QIR_DATA. Used for titles,
   subtitles, and row labels so no client name needs to be hardcoded in data. */
function applyVars(str, d) {
  if (!str || !d) return str || '';
  return String(str)
    .replace(/\{\{\s*client\s*\}\}/gi,    d.client    || '')
    .replace(/\{\{\s*quarter\s*\}\}/gi,   d.quarter   || '')
    .replace(/\{\{\s*asOfDate\s*\}\}/gi,  d.asOfDate  || '');
}

/* Per-asset-class palettes — each investment in the same class gets a different shade
   so they appear as distinct slices in the allocation donut. Override per-investment
   via inv.color if needed. */
const CLASS_PALETTES = {
  "Public Equities": ["#4f8ef7", "#2563eb", "#1e40af", "#60a5fa", "#3b82f6", "#1d4ed8"],
  "Private":         ["#f5c542", "#f97316", "#d97706", "#fbbf24", "#ea580c"],
  "Public":          ["#f05c6e", "#dc2626", "#ef4444", "#b91c1c"],
  "Alternatives":    ["#9b6ef7", "#7c3aed", "#a78bfa", "#6d28d9"],
  "Charity":         ["#10b981", "#047857", "#34d399", "#059669"]
};

function investmentColor(inv, allInvestments) {
  if (inv.color) return inv.color;                                    // explicit per-investment override
  const list = allInvestments || [];
  const sameClass = list.filter(i => i.assetClass === inv.assetClass);
  const idx = sameClass.indexOf(inv);
  const palette = CLASS_PALETTES[inv.assetClass] || ["#94a3b8"];
  return palette[idx % palette.length];
}

/* derive a return % for an investment (uses tax-adj override if present) */
function investmentReturnPct(inv) {
  if (typeof inv.taxAdjustedReturnPct === 'number') return inv.taxAdjustedReturnPct;
  if (typeof inv.annualizedIRR === 'number')        return inv.annualizedIRR;
  if (!inv.costBasis) return 0;
  // Subtract net inflows so the return reflects INVESTMENT PERFORMANCE only.
  const inflows = inv.netInflows || 0;
  return ((inv.currentValue - inv.costBasis - inflows) / inv.costBasis) * 100;
}

/* derive a gain/loss $ figure */
function investmentGain(inv) {
  if (inv.assetClass === "Alternatives" && typeof inv.taxAdjustedReturnPct === 'number') {
    // gain expressed as cost × tax-adj return % (override path, e.g. cash-on-cash)
    return inv.costBasis * (inv.taxAdjustedReturnPct / 100);
  }
  // Subtract net inflows so gain reflects INVESTMENT PERFORMANCE only.
  return inv.currentValue - inv.costBasis - (inv.netInflows || 0);
}

/* derive benchmark status from explicit field, else from return sign */
/* Derive benchmark status. Explicit inv.benchmark wins; otherwise auto-derive
   from the period return with asymmetric thresholds: >+5% → above, <-10% →
   below, between → inline. */
function benchmarkOf(inv) {
  if (inv.benchmark) return inv.benchmark;
  const r = investmentReturnPct(inv);
  if (r >   5) return "above";
  if (r < -10) return "below";
  return "inline";
}

function renderCostValueBar(d, costBasisLabel) {
  costBasisLabel = costBasisLabel || "Cost Basis";
  const invs = d.investments.filter(i => !i.excludeFromTotals);
  const maxVal = Math.max(...invs.flatMap(i => [i.costBasis||0, i.currentValue||0, (i.distributions||0)+(i.pendingDistributions||0)]));
  // Round max up to "nice" tick
  const ticks = [0.5e6, 1e6, 1.5e6, 2e6, 2.5e6, 3e6, 5e6, 10e6];
  const niceMax = ticks.find(t => t >= maxVal) || (Math.ceil(maxVal/1e6)*1e6);

  // Layout
  const W = 600, H = 290;
  const yTop = 20, yBot = 240;
  const xLeft = 60, xRight = 580;
  const chartW = xRight - xLeft;
  const chartH = yBot - yTop;
  const v2y = (v) => yBot - (v / niceMax) * chartH;
  const fmtTick = (v) => v >= 1e6 ? `$${(v/1e6).toFixed(v%1e6===0?0:1)}M` : `$${v/1e3}K`;

  // 5 grid lines
  const gridSteps = 4;
  let svg = `<svg class="svg-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,sans-serif">`;
  for (let i = 0; i <= gridSteps; i++) {
    const v = niceMax * (i / gridSteps);
    const y = yBot - (i / gridSteps) * chartH;
    svg += `<line x1="${xLeft}" y1="${y}" x2="${xRight}" y2="${y}" stroke="${i===0?'#e0e3ea':'#e8eaea'}" stroke-width="1"/>`;
    svg += `<text x="${xLeft-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7280">${fmtTick(v)}</text>`;
  }

  // Bars: 2 (or 3 if distributions) per investment, group width auto
  const groupCount = invs.length;
  const groupGap = 14;
  const groupW = (chartW - groupGap*(groupCount+1)) / groupCount;
  invs.forEach((inv, idx) => {
    const groupX = xLeft + groupGap + idx * (groupW + groupGap);
    const hasDist = (inv.distributions || inv.pendingDistributions);
    const barCount = hasDist ? 3 : 2;
    const barGap = 4;
    const barW = Math.max(8, (groupW - barGap*(barCount-1)) / barCount);

    // Cost bar
    const costH = (inv.costBasis||0) / niceMax * chartH;
    svg += `<rect x="${groupX}" y="${yBot-costH}" width="${barW}" height="${costH}" rx="3" fill="rgba(79,142,247,0.4)" stroke="#4f8ef7" stroke-width="1"/>`;
    // Current value bar
    const valH = (inv.currentValue||0) / niceMax * chartH;
    svg += `<rect x="${groupX+barW+barGap}" y="${yBot-valH}" width="${barW}" height="${valH}" rx="3" fill="rgba(155,110,247,0.6)" stroke="#9b6ef7" stroke-width="1"/>`;
    // Distributions bar (if applicable)
    if (hasDist) {
      const distVal = (inv.distributions||0) + (inv.pendingDistributions||0);
      const distH = distVal / niceMax * chartH;
      svg += `<rect x="${groupX+(barW+barGap)*2}" y="${yBot-distH}" width="${barW}" height="${distH}" rx="3" fill="rgba(22,169,122,0.65)" stroke="#16a97a" stroke-width="1"/>`;
    }
    // Label
    const labelX = groupX + groupW/2;
    // Prefer short chart label if explicitly set, else truncate. Smaller font when >5 groups.
    const rawLabel = inv.chartLabel || (inv.name.length > 12 ? inv.name.slice(0,11)+'…' : inv.name);
    const labelText = rawOrMasked(rawLabel);
    const labelFont = invs.length > 6 ? 8.5 : 10;
    svg += `<text x="${labelX}" y="${yBot+16}" text-anchor="middle" font-size="${labelFont}" fill="#6b7280">${escapeHtml(labelText)}</text>`;
  });

  // Legend — only show Distributions item if any account in the chart actually has them
  const anyDist = invs.some(i => (i.distributions || i.pendingDistributions));
  svg += `
    <rect x="62"  y="272" width="10" height="10" rx="2" fill="rgba(79,142,247,0.4)" stroke="#4f8ef7" stroke-width="1"/>
    <text x="76"  y="281" font-size="10" fill="#6b7280">${costBasisLabel}</text>
    <rect x="155" y="272" width="10" height="10" rx="2" fill="rgba(155,110,247,0.6)" stroke="#9b6ef7" stroke-width="1"/>
    <text x="169" y="281" font-size="10" fill="#6b7280">Current Value</text>
    ${anyDist ? `<rect x="262" y="272" width="10" height="10" rx="2" fill="rgba(22,169,122,0.65)" stroke="#16a97a" stroke-width="1"/><text x="276" y="281" font-size="10" fill="#6b7280">Distributions (incl. Pending)</text>` : ''}
  </svg>`;

  document.getElementById('cost-value-bar').innerHTML = svg;
}

function renderInvestmentCard(inv, d, idx) {
  const cm = classMeta(inv.assetClass);
  const bench = benchmarkOf(inv);
  const benchChip = {
    above:  '<span class="flag-chip f-above">✅ Above Benchmark</span>',
    inline: '<span class="flag-chip f-inline">— In-line</span>',
    below:  '<span class="flag-chip f-below">❌ Below Benchmark</span>'
  }[bench];

  const gain = investmentGain(inv);
  const ret  = investmentReturnPct(inv);
  const gainClass = gain >= 0 ? 'gain' : 'loss';
  const retClass  = ret  >= 0 ? 'gain' : 'loss';

  // Build metric tiles based on what data is present
  const metrics = [];
  metrics.push({ l: "Current Value", v: fmt.money(inv.currentValue), cls: 'neut' });
  metrics.push({ l: (d && d.periodLabels && d.periodLabels.costBasis) || "Cost Basis", v: fmt.money(inv.costBasis), cls: 'neut' });

  if (inv.distributions !== undefined) {
    metrics.push({ l: "Distributions", v: fmt.money(inv.distributions), cls: 'gain' });
  } else {
    metrics.push({ l: gain>=0 ? "Gain" : "Loss", v: (gain>=0?'+':'–')+fmt.money(Math.abs(gain)), cls: gainClass });
  }

  if (inv.pendingDistributions) {
    metrics.push({ l: `Pending ${inv.pendingDate||''}`.trim(), v: fmt.money(inv.pendingDistributions), cls: 'neut', style: 'color:var(--yellow)' });
  }

  if (typeof inv.taxAdjustedReturnPct === 'number') {
    metrics.push({ l: inv.returnLabel || "Tax-Adj Return", v: fmt.pct(inv.taxAdjustedReturnPct), cls: 'neut', style: 'color:var(--purple)' });
  } else {
    metrics.push({ l: (d && d.periodLabels && d.periodLabels.totalReturn) || "Total Return", v: fmt.pct(ret), cls: retClass });
  }

  // NEW: Net Inflows tile (period-specific, e.g. "Q1 Inflows" or "YTD Inflows")
  if (typeof inv.netInflows === 'number') {
    const inflowsLabel = (d && d.periodLabels && d.periodLabels.netInflows) || "Net Inflows";
    const sign = inv.netInflows > 0 ? '+' : '';
    metrics.push({
      l: inflowsLabel,
      v: sign + fmt.money(inv.netInflows),
      cls: inv.netInflows > 0 ? 'gain' : (inv.netInflows < 0 ? 'loss' : 'neut')
    });
  }

  // NEW: Prior-period return tile (e.g. "2025 Return")
  if (typeof inv.priorPeriodReturnPct === 'number') {
    const priorLabel = (d && d.periodLabels && d.periodLabels.priorPeriod) || "Prior Year";
    metrics.push({
      l: priorLabel,
      v: fmt.pct(inv.priorPeriodReturnPct),
      cls: inv.priorPeriodReturnPct >= 0 ? 'gain' : 'loss'
    });
  }

  if (typeof inv.annualizedReturnPct === 'number') {
    metrics.push({ l: "Annualized", v: fmt.pct(inv.annualizedReturnPct), cls: 'neut', style: 'color:var(--purple)' });
  } else if (typeof inv.annualizedIRR === 'number') {
    metrics.push({ l: "Annualized IRR", v: fmt.pct(inv.annualizedIRR), cls: 'gain' });
  }

  if (inv.entryPrice !== undefined) {
    metrics.push({ l: "Entry Price", v: '$'+inv.entryPrice.toFixed(2), cls: 'neut' });
  }
  if (inv.currentPrice !== undefined) {
    const priceClass = inv.currentPrice >= (inv.entryPrice||0) ? 'gain' : 'loss';
    metrics.push({ l: "Current Price"+(inv.currentPriceFootnote?'*':''), v: '~$'+inv.currentPrice.toFixed(2), cls: priceClass });
  }
  if (inv.inceptionDate) {
    metrics.push({ l: "Inception", v: inv.inceptionDate, cls: 'neut' });
  }

  // Limit to 6 metric tiles for visual balance
  const metricTiles = metrics.slice(0,6).map(m =>
    `<div class="m"><div class="ml">${m.l}</div><div class="mv ${m.cls}" style="${m.style||''}">${m.v}</div></div>`
  ).join('');

  // Progress bar
  const pbarPct = Math.min(Math.abs(ret), 100);
  const pbarColor = ret >= 0 ? (typeof inv.taxAdjustedReturnPct==='number'?'var(--purple)':'var(--green)') : 'var(--red)';
  const pbarLbl = ret >= 0 ? 'Return vs cost' : 'Loss vs cost';

  // Footnotes
  const fnotes = [];
  if (inv.entryDate || inv.shares || inv.tvpi || inv.irr) {
    const parts = [];
    if (inv.entryDate)         parts.push(`Entry: ${inv.entryDate}`);
    if (inv.shares !== undefined) parts.push(`${inv.shares.toLocaleString()} shares`);
    if (typeof inv.tvpi === 'number') parts.push(`TVPI: ${inv.tvpi}x`);
    if (typeof inv.irr === 'number')  parts.push(`IRR: ${fmt.pct(inv.irr)}`);
    fnotes.push(parts.join(' · '));
  }
  if (inv.footer) fnotes.push(inv.footer);
  if (inv.currentPriceFootnote) fnotes.push('* '+inv.currentPriceFootnote);

  return `
    <div class="inv-card">
      <div class="inv-head">
        <div>
          <div class="inv-name">${inv.icon||''} ${window.__QIR_BUILDER__
            ? `<span class="inv-edit" contenteditable="plaintext-only" onblur="updateInvField(${idx},'name',this.textContent)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" title="Click to edit · account name">${escapeHtml(inv.name||'')}</span>`
            : escapeHtml(rawOrMasked(inv.name))}</div>
          <div class="inv-sub">${window.__QIR_BUILDER__
            ? `<span class="inv-edit" contenteditable="plaintext-only" onblur="updateInvField(${idx},'subtitle',this.textContent)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" title="Click to edit · description" data-placeholder="Add a description…">${escapeHtml(inv.subtitle||'')}</span>`
            : escapeHtml(rawOrMasked(inv.subtitle))}</div>
        </div>
        <div class="inv-head-right">
          ${inclusionTogglePill(inv, idx)}
          <span class="badge ${cm.badge}">${inv.assetClass}</span>
        </div>
      </div>
      <div class="metrics">${metricTiles}</div>
      <div class="pbar-row">
        <span class="pbar-lbl">${pbarLbl}</span>
        <div class="pbar-bg"><div class="pbar-fill" style="width:${pbarPct}%;background:${pbarColor}"></div></div>
        <span class="pbar-val ${retClass}" style="${typeof inv.taxAdjustedReturnPct==='number'?'color:var(--purple)':''}">${fmt.pct(ret)}</span>
      </div>
      ${fnotes.map(n => `<div class="fnote">${n}</div>`).join('')}
      ${(typeof inv.q1RefValue === 'number') ? (() => {
        const refLabel = (d && d.periodLabels && d.periodLabels.q1Reference) || "Q1 ref";
        const refDate  = (d && d.periodLabels && d.periodLabels.q1RefDate)   || "";
        const parts = [fmt.money(inv.q1RefValue)];
        if (typeof inv.q1RefReturnPct === 'number') parts.push(fmt.pct(inv.q1RefReturnPct));
        if (typeof inv.q1RefInflows === 'number' && inv.q1RefInflows > 0) parts.push('+' + fmt.money(inv.q1RefInflows) + ' inflows');
        return '<div class="q1-ref"><span class="q1-ref-label">' + refLabel + (refDate?' ('+refDate+')':'') + '</span>: ' + parts.join(' <span class="q1-ref-sep">·</span> ') + '</div>';
      })() : ''}
      ${benchChip}
    </div>`;
}


/* ─── Section: Tax-benefit callout ─────────────────────────────────── */
function renderCallout(d) {
  if (!d.taxCallout || !d.taxCallout.enabled) return;
  const c = d.taxCallout;
  const colorMap = { green:'var(--green)', yellow:'var(--yellow)', red:'var(--red)', purple:'var(--purple)' };
  let bodyHtml;

  // NEW structured format — computed math, optional inline inputs in builder mode
  if (typeof c.lossDeductionPct === 'number' && typeof c.taxRate === 'number') {
    const investedAmount = c.investedAmount || 0;
    const lossDeductionPct = parseFloat(c.lossDeductionPct) || 0;
    const taxRate = parseFloat(c.taxRate) || 0;
    const distributionsReceived = c.distributionsReceived || 0;
    const pendingDistributions = c.pendingDistributions || 0;

    // principalInvested = total LP principal across all drilling years (deductible basis).
    // Falls back to investedAmount if not specified.
    const principalInvested    = c.principalInvested || investedAmount;
    const deductible           = principalInvested * (lossDeductionPct / 100);
    // taxBenefitOverride wins if set — for multi-year IDCs where the
    // formula's single-period math doesn't equal the actual cumulative tax savings.
    const taxSavings           = (typeof c.taxBenefitOverride === 'number')
                                    ? c.taxBenefitOverride
                                    : deductible * (taxRate / 100);
    const totalDistributions   = distributionsReceived + pendingDistributions;
    const totalEconomicBenefit = taxSavings + totalDistributions;
    const netCostAfterBenefit  = investedAmount - taxSavings;
    const taxAdjReturnPct      = investedAmount > 0 ? (totalEconomicBenefit / investedAmount) * 100 : 0;

    const isBuilder = !!window.__QIR_BUILDER__;

    const lossField = isBuilder
      ? `<input type="number" min="0" step="1" value="${lossDeductionPct}" class="tc-edit" onchange="updateTaxCallout('lossDeductionPct', this.value)" title="Editable: % of investment deductible (can exceed 100% for cumulative multi-year IDCs)">`
      : `<strong>${lossDeductionPct}%</strong>`;
    const taxField = isBuilder
      ? `<input type="number" min="0" max="100" step="0.5" value="${taxRate}" class="tc-edit" onchange="updateTaxCallout('taxRate', this.value)" title="Editable: client's top federal income tax bracket">`
      : `<strong>${taxRate}%</strong>`;

    const stateNote = c.stateNote ? ` (${c.stateNote})` : '';
    const pendingLabel = c.pendingDate ? `pending ${c.pendingDate}` : 'pending receipt';

    const parts = [
      `${lossField}${isBuilder?'%':''} loss deduction × <strong>${fmt.money(principalInvested)}</strong> = <strong>${fmt.money(deductible)}</strong> deductible`,
      `${taxField}${isBuilder?'%':''} top fed rate${stateNote}`,
      `<strong style="color:var(--green)">${fmt.money(taxSavings)}</strong> estimated tax savings`,
      `<strong>${fmt.money(distributionsReceived)}</strong> distributions received`,
    ];
    if (pendingDistributions) {
      parts.push(`<strong style="color:var(--yellow)">${fmt.money(pendingDistributions)}</strong> earned, ${pendingLabel}`);
    }
    parts.push(
      `<strong>${fmt.money(totalDistributions)}</strong> total distributions`,
      `<strong style="color:var(--green)">${fmt.money(totalEconomicBenefit)}</strong> total economic benefit`,
      `<strong>${fmt.money(netCostAfterBenefit)}</strong> net cost after tax benefit`,
      `<strong style="color:var(--green)">${taxAdjReturnPct.toFixed(2)}%</strong> tax-adj cumulative return`
    );
    bodyHtml = parts.join(' &nbsp;·&nbsp; ');
  }
  else if (c.items && c.items.length) {
    bodyHtml = c.items.map(i => {
      const colorStyle = i.color ? `color:${colorMap[i.color]||i.color}` : 'color:var(--text)';
      return `<strong style="${colorStyle}">${i.value}</strong> <span style="opacity:.85">${i.label}</span>`;
    }).join(' &nbsp;·&nbsp; ');
  } else {
    return;
  }

  document.getElementById('callout-mount').innerHTML = `
    <div class="callout">
      <div class="callout-icon">${c.icon||'💡'}</div>
      <div>
        <div class="callout-title">${applyVars(c.title, d)}</div>
        <div class="callout-body">${bodyHtml}</div>
      </div>
    </div>`;
}


/* ─── Section: Summary table ───────────────────────────────────────── */
function renderTable(d) {
  const counted = d.investments.filter(i => !i.excludeFromTotals);
  const totalValue = counted.reduce((s,i) => s + (i.currentValue||0), 0);
  const totalCost  = counted.reduce((s,i) => s + (i.costBasis||0), 0);
  const totalGain  = counted.reduce((s,i) => s + investmentGain(i), 0);
  const overallReturn = totalCost ? (totalGain/totalCost)*100 : 0;
  const isBuilder = !!window.__QIR_BUILDER__;

  // Iterate ALL investments so the user can toggle excluded ones back from the table too.
  // Excluded rows render muted and do NOT roll into the TOTAL row.
  const rows = d.investments.map((inv, idx) => {
    const cm = classMeta(inv.assetClass);
    const gain = investmentGain(inv);
    const ret  = investmentReturnPct(inv);
    const isExcluded = !!inv.excludeFromTotals;
    const allocPct = (!isExcluded && totalValue) ? (inv.currentValue/totalValue*100) : 0;
    const allocCell = isExcluded ? '—' : (allocPct.toFixed(1) + '%');
    const bench = benchmarkOf(inv);
    const benchChip = {
      above:  '<span class="flag-chip f-above" style="margin:0;padding:2px 8px;font-size:.63rem">✅ Above</span>',
      inline: '<span class="flag-chip f-inline" style="margin:0;padding:2px 8px;font-size:.63rem">— In-line</span>',
      below:  '<span class="flag-chip f-below" style="margin:0;padding:2px 8px;font-size:.63rem">❌ Below</span>'
    }[bench];
    const gainClass = gain>=0 ? 'gain' : 'loss';
    const togglePillCell = isBuilder ? '<td>' + inclusionTogglePill(inv, idx) + '</td>' : '';
    const rowCls = isExcluded ? ' class="excl-row"' : '';
    return `
      <tr${rowCls}>
        <td><span class="tdot" style="background:${investmentColor(inv, d.investments)}"></span>${inv.icon||''} ${escapeHtml(rawOrMasked(inv.name))}</td>
        <td>${inv.assetClass}</td>
        <td>${fmt.money(inv.costBasis)}</td>
        <td>${fmt.money(inv.currentValue)}</td>
        <td class="${gainClass}">${(gain>=0?'+':'–')}${fmt.money(Math.abs(gain))}</td>
        <td class="${gainClass}">${fmt.pct(ret)}</td>
        <td>${allocCell}</td>
        ${togglePillCell}
        <td>${benchChip}</td>
      </tr>`;
  }).join('');

  document.getElementById('table-mount').innerHTML = `
    <div class="sec">Portfolio Summary Table</div>
    <div class="card" style="overflow:auto">
      <table class="tbl">
        <thead><tr>
          <th>Investment</th><th>Asset Class</th><th>${(d.periodLabels && d.periodLabels.costBasis) || "Cost Basis"}</th><th>Current Value</th>
          <th>Gain / (Loss)</th><th>Return</th><th>Allocation</th>${isBuilder ? '<th>Include?</th>' : ''}<th>Status</th>
        </tr></thead>
        <tbody>
          ${rows}
          <tr class="tot">
            <td colspan="2"><strong>TOTAL PORTFOLIO</strong></td>
            <td><strong>${fmt.money(totalCost)}</strong></td>
            <td><strong>${fmt.money(totalValue)}</strong></td>
            <td class="${totalGain>=0?'gain':'loss'}"><strong>${(totalGain>=0?'+':'–')}${fmt.money(Math.abs(totalGain))}</strong></td>
            <td class="${totalGain>=0?'gain':'loss'}"><strong>${fmt.pct(overallReturn)}</strong></td>
            <td><strong>100%</strong></td>${isBuilder ? '<td></td>' : ''}<td></td>
          </tr>
        </tbody>
      </table>
    </div>`;
}


/* ─── Section: Performance — return chart + economic benefit ───────── */
function renderPerformance(d) {
  const p = d.performance;
  if (!p || !p.enabled) return;

  let html = '<div class="sec">Return & Performance Analysis</div><div class="perf-row">';

  if (p.showReturnChart) {
    html += `<div class="card"><h3>Return by Account (%)</h3><div id="return-chart"></div></div>`;
  }
  if (p.economicBenefit && p.economicBenefit.enabled) {
    html += `<div class="card"><h3>${p.economicBenefit.title||'Economic Benefit'}</h3><div id="ebenefit-donut" style="width:100%;height:260px;"></div></div>`;
  }
  html += '</div>';
  document.getElementById('performance-mount').innerHTML = html;

  if (p.showReturnChart) renderReturnChart(d);
  if (p.economicBenefit && p.economicBenefit.enabled) renderEconomicDonut(p.economicBenefit);
}

function renderReturnChart(d) {
  const invs = d.investments;
  const returns = invs.map(i => investmentReturnPct(i));
  const minR = Math.min(0, ...returns);
  const maxR = Math.max(0, ...returns);
  // Pad
  const pad = Math.max(10, (maxR - minR) * 0.05);
  const lo = Math.floor((minR - pad)/10)*10;
  const hi = Math.ceil((maxR + pad)/10)*10;
  const range = hi - lo;

  const W = 580, H = 30 + invs.length * 47;
  const xLeft = 60, xRight = 540;
  const chartW = xRight - xLeft;
  const xZero = xLeft + ((0 - lo)/range)*chartW;

  let svg = `<svg class="svg-chart" viewBox="0 0 ${W} ${H+30}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,sans-serif">`;

  // Gridlines (every 50%)
  const tickStep = range > 300 ? 100 : (range > 100 ? 50 : 25);
  for (let v = Math.ceil(lo/tickStep)*tickStep; v <= hi; v += tickStep) {
    const x = xLeft + ((v - lo)/range)*chartW;
    svg += `<line x1="${x}" y1="10" x2="${x}" y2="${H-30}" stroke="${v===0?'#cbd5e1':'#eff1f3'}" stroke-width="${v===0?1.5:1}"/>`;
    svg += `<text x="${x}" y="${H-15}" text-anchor="middle" font-size="9.5" fill="#6b7280">${v>0?'+':''}${v}%</text>`;
  }

  // Bars
  invs.forEach((inv, idx) => {
    const ret = returns[idx];
    const yMid = 30 + idx * 47;
    const yBar = yMid - 12;
    const cm = classMeta(inv.assetClass);
    const isTaxAdj = typeof inv.taxAdjustedReturnPct === 'number';
    const fill = isTaxAdj ? 'rgba(124,58,237,0.6)' : (ret >= 0 ? 'rgba(22,169,122,0.65)' : 'rgba(220,38,38,0.6)');
    const stroke = isTaxAdj ? '#7c3aed' : (ret >= 0 ? '#16a97a' : '#dc2626');

    if (ret >= 0) {
      // Positive: name on the LEFT of zero, bar extends right, % label after the bar
      svg += `<text x="${xZero-6}" y="${yMid+3}" text-anchor="end" font-size="10.5" fill="#1a1d2e" font-weight="600">${escapeHtml(rawOrMasked(inv.name))}</text>`;
      const w = (ret/range)*chartW;
      svg += `<rect x="${xZero}" y="${yBar}" width="${w}" height="24" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="0"/>`;
      svg += `<text x="${xZero+w+5}" y="${yMid+3}" font-size="10" fill="${stroke}" font-weight="700">${fmt.pct(ret)}</text>`;
    } else {
      // Negative: bar extends LEFT from zero. Both the % label AND the account name
      // sit to the RIGHT of the zero line so they don't collide with the bar.
      const w = (Math.abs(ret)/range)*chartW;
      svg += `<rect x="${xZero-w}" y="${yBar}" width="${w}" height="24" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="0"/>`;
      svg += `<text x="${xZero+5}" y="${yMid+3}" font-size="10" fill="${stroke}" font-weight="700">${fmt.pct(ret)}</text>`;
      svg += `<text x="${xZero+62}" y="${yMid+3}" font-size="10.5" fill="#1a1d2e" font-weight="600">${escapeHtml(rawOrMasked(inv.name))}</text>`;
    }
  });

  svg += '</svg>';
  document.getElementById('return-chart').innerHTML = svg;
}

function renderEconomicDonut(eb) {
  const slices = eb.slices.map(s => ({ value: s.value, color: s.color }));
  const legend = eb.slices.map(s => ({
    color: s.color,
    stroke: s.color,
    line1: s.label,
    line2: s.subLabel
  }));
  buildDonut('ebenefit-donut', slices, 110, 130, 95, 54, legend, 500, 260);
}

/* ─── Section: US Energy — Investment Tracking ───────────────────────
   Multi-fund table when funds[] is populated, multi-period rows otherwise. */
function renderUSEnergyTracking(d) {
  if (!d.usEnergyTracking || !d.usEnergyTracking.enabled) return;
  const t = d.usEnergyTracking;
  const mount = document.getElementById('usenergy-tracking-mount');
  if (!mount) return;

  if (Array.isArray(t.funds) && t.funds.length) {
    renderUSEnergyMultiFund(t, d, mount);
    return;
  }
  if (!Array.isArray(t.rows) || !t.rows.length || !Array.isArray(t.periods)) return;

  const headerHtml = '<tr><th></th>' + t.periods.map(p => '<th>' + p + '</th>').join('') + '</tr>';
  const bodyHtml = t.rows.map(row => {
    const cells = row.values.map(v => {
      if (v === null || v === undefined || v === '') return '<td class="usen-blank">—</td>';
      const cls = row.emphasis ? 'usen-emph' : '';
      const formatted = row.format === 'pct' ? (v * 100).toFixed(2) + '%' : fmt.money(v);
      return '<td class="' + cls + '">' + formatted + '</td>';
    }).join('');
    const noteHtml = row.note ? '<span class="usen-note">' + row.note + '</span>' : '';
    const trClass = row.bold ? 'usen-bold' : '';
    return '<tr class="' + trClass + '"><td class="usen-label">' + applyVars(row.label, d) + noteHtml + '</td>' + cells + '</tr>';
  }).join('');

  mount.innerHTML =
    '<div class="sec">' + applyVars(t.title || 'US Energy — Investment Tracking', d) + '</div>' +
    '<div class="usen-card">' +
      (t.subtitle ? '<div class="usen-sub">' + applyVars(t.subtitle, d) + '</div>' : '') +
      '<table class="usen-table"><thead>' + headerHtml + '</thead><tbody>' + bodyHtml + '</tbody></table>' +
      (t.footnote ? '<div style="margin-top:10px;font-size:.67rem;color:var(--muted);font-style:italic">' + applyVars(t.footnote, d) + '</div>' : '') +
    '</div>';
}

function renderUSEnergyMultiFund(t, d, mount) {
  const funds = t.funds.slice().sort((a, b) => (b.invested || 0) - (a.invested || 0));
  const sum = (key) => funds.reduce((s, f) => s + (Number(f[key]) || 0), 0);
  const totalInvested      = sum('invested');
  const totalDistributions = sum('distributions');
  const totalTaxBenefits   = sum('taxBenefits');
  const totalLpBalance     = sum('lpBalance');
  const weightedReturn = totalInvested > 0
    ? funds.reduce((s, f) => s + (Number(f.totalReturnPct) || 0) * (Number(f.invested) || 0), 0) / totalInvested
    : 0;

  const moneyCell = (v) => '<td>' + (v ? fmt.money(v) : '<span class="usen-blank">—</span>') + '</td>';
  const pctCell   = (v) => '<td>' + (typeof v === 'number' && isFinite(v) ? v.toFixed(2) + '%' : '<span class="usen-blank">—</span>') + '</td>';

  const bodyRows = funds.map(f =>
    '<tr>' +
      '<td class="usen-label">' + (f.partnership || '—') + '</td>' +
      '<td style="font-size:.7rem;color:var(--muted)">' + (f.asOfDate || '—') + '</td>' +
      moneyCell(f.invested) +
      moneyCell(f.distributions) +
      moneyCell(f.taxBenefits) +
      moneyCell(f.lpBalance) +
      pctCell(f.totalReturnPct) +
    '</tr>'
  ).join('');

  const totalsRow =
    '<tr class="usen-bold">' +
      '<td class="usen-label">Total (' + funds.length + ' fund' + (funds.length === 1 ? '' : 's') + ')</td>' +
      '<td></td>' +
      moneyCell(totalInvested) +
      moneyCell(totalDistributions) +
      moneyCell(totalTaxBenefits) +
      moneyCell(totalLpBalance) +
      pctCell(weightedReturn) +
    '</tr>';

  const headerHtml =
    '<tr><th>Partnership</th><th>Statement</th><th>Invested</th><th>Cash Returned</th><th>Tax Benefits</th><th>LP Balance</th><th>Total Return</th></tr>';

  mount.innerHTML =
    '<div class="sec">' + applyVars(t.title || 'U.S. Energy Drilling Funds — Portfolio Summary', d) + '</div>' +
    '<div class="usen-card">' +
      (t.subtitle ? '<div class="usen-sub">' + applyVars(t.subtitle, d) + '</div>'
        : '<div class="usen-sub">Inception-to-date cumulative metrics across all U.S. Energy partnerships. LP Balance = Invested − Cash Returned (depletion-driven runoff).</div>') +
      '<table class="usen-table"><thead>' + headerHtml + '</thead><tbody>' + bodyRows + totalsRow + '</tbody></table>' +
      (t.footnote ? '<div style="margin-top:10px;font-size:.67rem;color:var(--muted);font-style:italic">' + applyVars(t.footnote, d) + '</div>' : '') +
    '</div>';
}

/* ─── Donut builder (shared with allocation + economic-benefit) ────── */
function buildDonut(containerId, slices, cx, cy, R, r, legendItems, VW, VH){
  const container = document.getElementById(containerId);
  if(!container) return;
  const total = slices.reduce((s,sl)=>s+sl.value,0);
  if (total <= 0) { container.innerHTML = '<div style="color:var(--muted);font-size:.75rem;padding:20px">No data</div>'; return; }

  const parts = [`<svg width="100%" height="${VH}" viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMinYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,sans-serif">`];
  let startAngle = -Math.PI/2;
  slices.forEach(sl => {
    const sweep = (sl.value/total)*2*Math.PI;
    const endAngle = startAngle + sweep;
    const x1=cx+R*Math.cos(startAngle), y1=cy+R*Math.sin(startAngle);
    const x2=cx+R*Math.cos(endAngle),   y2=cy+R*Math.sin(endAngle);
    const x3=cx+r*Math.cos(endAngle),   y3=cy+r*Math.sin(endAngle);
    const x4=cx+r*Math.cos(startAngle), y4=cy+r*Math.sin(startAngle);
    const large = sweep>Math.PI?1:0;
    const d = `M ${x1.toFixed(2)} ${y1.toFixed(2)}
               A ${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}
               L ${x3.toFixed(2)} ${y3.toFixed(2)}
               A ${r} ${r} 0 ${large} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
    parts.push(`<path d="${d}" fill="${sl.color}" stroke="#fff" stroke-width="2"/>`);
    const midA = startAngle + sweep/2;
    const lR = (R+r)/2;
    const lx = cx+lR*Math.cos(midA), ly = cy+lR*Math.sin(midA);
    const pct = Math.round(sl.value/total*100);
    if(pct>=8){
      parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#fff">${pct}%</text>`);
    }
    startAngle = endAngle;
  });
  // Legend (only if items provided)
  if (legendItems && legendItems.length){
    const legX = cx + R + 22;
    const legSpacing = 36;
    const legY = cy - ((legendItems.length - 1) * legSpacing) / 2;
    legendItems.forEach((li,i) => {
      const y = legY + i*legSpacing;
      parts.push(`<rect x="${legX}" y="${y-6}" width="12" height="12" rx="3" fill="${li.color}" stroke="${li.stroke}" stroke-width="1"/>`);
      parts.push(`<text x="${legX+17}" y="${y}" font-size="11" fill="#1a1d2e" dominant-baseline="central" font-weight="500">${li.line1}</text>`);
      if(li.line2){
        parts.push(`<text x="${legX+17}" y="${y+15}" font-size="10" fill="#6b7280" dominant-baseline="central">${li.line2}</text>`);
      }
    });
  }
  parts.push('</svg>');
  container.innerHTML = parts.join('');
}
